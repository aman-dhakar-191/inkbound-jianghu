[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="prototype/*, tests/*, tools/*, docs/*, scripts/*"
export_path="build/jianghu-chain.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; The Release workflow overwrites version/code and version/name for each release.
version/code=1
version/name="0.0.0-dev"
; Must match "package" in the private app store's catalog.json. Never change it
; after the first release, or phones treat it as a different app.
package/unique_name="io.github.amandhakar.jianghuchain"
package/name="Jianghu Chain"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
; Signing comes from GODOT_ANDROID_KEYSTORE_* environment variables in CI.
; Never put keystore paths or passwords here: this file is committed.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
